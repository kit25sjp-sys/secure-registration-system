<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – SecureReg</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav class="top-nav">
  <div class="top-nav-logo">
    <span>SecureReg</span>
  </div>
  <div class="top-nav-links">
    <a href="/" class="nav-link">Register</a>
    <a href="/login" class="nav-link nav-link-active">Login</a>
  </div>
</nav>

<div class="page-wrapper">

  <!--  LEFT: Login Form  -->
  <div class="auth-container">

    <div class="auth-header">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your secure account</p>
    </div>

    <div id="alertContainer" class="alert-container hidden"></div>

    <form id="loginForm" class="auth-form" novalidate>

      <!-- Email or Username -->
      <div class="form-group">
        <label for="emailInput" class="form-label">
          Email or Username
        </label>
        <div class="input-wrapper">
          <input type="text" id="emailInput" class="form-input"
                 placeholder="Enter your email or username"
                 autocomplete="username" required>
        </div>
        <span class="form-error" id="emailError"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="passwordInput" class="form-label">
          <span class="label-icon"></span> Password
        </label>
        <div class="input-wrapper">
          <input type="password" id="passwordInput" class="form-input"
                 placeholder="Enter your password"
                 autocomplete="current-password" required>
          <button type="button" class="toggle-password" data-target="passwordInput" title="Show / hide password" aria-label="Toggle password visibility">
            <span id="passwordInputEye"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
          </button>
        </div>
        <span class="form-error" id="passwordError"></span>
      </div>


      <!-- Submit -->
      <button type="submit" id="submitBtn" class="btn btn-primary btn-full">
        <span id="submitBtnText">Sign In</span>
        <span id="submitBtnLoader" class="hidden"></span>
      </button>
    </form>

    <div class="auth-footer">
      <div>Don't have an account? <a href="/" class="link">Create one</a></div>
      <div style="margin-top: 12px;">Forgot password? <a href="/password-reset.html" class="link">Reset it</a></div>
    </div>

    <!-- Security note -->
    <div style="margin-top:24px;padding:14px;background:#fafafa;border:1px solid #e0e0e0;border-radius:8px;font-size:.78rem;color:#666;text-align:center">
       Your connection is protected. Accounts are locked for 15 minutes after 5 failed attempts.
    </div>
  </div>

</div>

<script src="/js/clientUtils.js"></script>
<script src="/js/session-manager.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
