<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – SecureReg</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="dashboard-body">

<nav class="top-nav">
  <div class="top-nav-logo">
    <span>SecureReg</span>
  </div>
  <div class="top-nav-links">
    <a href="/dashboard" class="nav-link nav-link-active">Dashboard</a>
    <button id="logoutBtn" class="nav-link nav-link-logout btn-nav-logout">Logout</button>
  </div>
</nav>

<div class="dashboard-container">

  <!-- Role Access Panel (shows based on user role) -->
  <div id="roleAccessSection" class="dashboard-role-section" style="display:none"></div>

  <!-- Main Content: Two Column Layout -->
  <div class="dashboard-grid">
    
    <!-- LEFT: User Account Info -->
    <div class="dashboard-card-modern">
      <div class="dashboard-avatar-large" id="avatarCircle">?</div>
      <h1 class="dashboard-welcome" id="welcomeHeading">Welcome!</h1>
      <p class="dashboard-email" id="dashboardEmail">Loading…</p>
      
      <div class="dashboard-badges-container">
        <span class="badge-modern badge-verified">Account Verified</span>
        <span class="badge-modern" id="userRoleBadge">Loading…</span>
      </div>
    </div>

    <!-- RIGHT: Account Management -->
    <div class="dashboard-card-modern account-management-card">
      <h2 class="account-title">Account Settings</h2>
      <p class="account-subtitle">Manage your account information and security preferences.</p>
      
      <div class="account-info-section">
        
        <!-- Username -->
        <div class="account-info-item">
          <div class="info-header">
            <span class="info-label">Username</span>
            <button class="btn-icon-edit" id="btnEditUsername" title="Edit username">✏️</button>
          </div>
          <span class="info-value" id="displayUsername">—</span>
        </div>

        <!-- Email (Read-only) -->
        <div class="account-info-item">
          <div class="info-header">
            <span class="info-label">Email Address</span>
            <span class="badge-badge-small">Verified</span>
          </div>
          <span class="info-value" id="displayEmail">—</span>
        </div>

        <!-- Phone Number -->
        <div class="account-info-item">
          <div class="info-header">
            <span class="info-label">Phone Number</span>
            <button class="btn-icon-edit" id="btnEditPhone" title="Edit phone number">✏️</button>
          </div>
          <span class="info-value" id="displayPhone">Not provided</span>
        </div>

        <!-- Account Created -->
        <div class="account-info-item">
          <span class="info-label">Account Created</span>
          <span class="info-value info-secondary" id="displayCreated">—</span>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="account-actions">
        <a href="/change-password" class="btn-account-action btn-primary-action">
          <span>🔒</span> Change Password
        </a>
        <button id="btnLogoutAccount" class="btn-account-action btn-logout-action">
          <span>⏏️</span> Logout
        </button>
      </div>
    </div>

  </div>

</div>

<!-- Edit Username Modal -->
<div id="editUsernameModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Change Username</h2>
      <button class="modal-close-btn" onclick="closeModal('editUsernameModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">New Username</label>
        <input type="text" id="editUsernameInput" class="form-input" placeholder="Enter new username" />
        <div id="editUsernameError" class="form-error"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal('editUsernameModal')">Cancel</button>
      <button class="modal-btn modal-btn-save" onclick="saveUsername()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Edit Phone Modal -->
<div id="editPhoneModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Change Phone Number</h2>
      <button class="modal-close-btn" onclick="closeModal('editPhoneModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" id="editPhoneInput" class="form-input" placeholder="+1 (555) 123-4567" />
        <div id="editPhoneError" class="form-error"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal('editPhoneModal')">Cancel</button>
      <button class="modal-btn modal-btn-save" onclick="savePhone()">Save Changes</button>
    </div>
  </div>
</div>

<script>
/* ── Guard: redirect to login if not authenticated ─────── */
(async () => {
  try {
    const res  = await fetch('/api/auth/me', { credentials: 'include' });
    const data = await res.json();

    if (!data.success) {
      window.location.replace('/login');
      return;
    }

    const { username, email, role, created_at, phone_number } = data.user;
    document.getElementById('avatarCircle').textContent   = username.charAt(0).toUpperCase();
    document.getElementById('welcomeHeading').textContent = `Welcome back, ${username}!`;
    document.getElementById('dashboardEmail').textContent = email;
    document.getElementById('displayUsername').textContent = username;
    document.getElementById('displayEmail').textContent = email;
    document.getElementById('displayPhone').textContent = phone_number || 'Not provided';
    document.title = `Dashboard – ${username}`;

    // Format created date
    if (created_at) {
      try {
        const createdDate = new Date(created_at.endsWith('Z') ? created_at : created_at + 'Z').toLocaleDateString();
        document.getElementById('displayCreated').textContent = createdDate;
      } catch (e) {
        document.getElementById('displayCreated').textContent = created_at;
      }
    }

    /* Dynamic role badge */
    const roleBadge   = document.getElementById('userRoleBadge');
    const roleCfg     = {
      admin:      { cls: 'badge-modern badge-admin',    label: 'Administrator' },
      moderator:  { cls: 'badge-modern badge-moderator',   label: 'Moderator / Manager' },
      manager:    { cls: 'badge-modern badge-manager', label: 'Manager (View-Only)' },
      editor:     { cls: 'badge-modern badge-moderator',   label: 'Moderator / Manager' },
      user:       { cls: 'badge-modern badge-user',      label: 'Registered User' },
    };
    const rc = roleCfg[role] || roleCfg.user;
    roleBadge.className   = rc.cls;
    roleBadge.textContent = rc.label;

    /* Role-specific access panel */
    const accessSection = document.getElementById('roleAccessSection');
    if (role === 'admin') {
      accessSection.style.display = 'block';
      accessSection.innerHTML = `
        <div style="background:#fff0f0;border:1.5px solid #e74c3c;border-radius:10px;padding:16px 20px">
          <p style="margin:0 0 14px;font-size:.92rem;font-weight:700;color:#c0392b">⚙️ Management Panel</p>
          <a href="/admin" class="btn btn-danger" style="text-decoration:none">⚙️ Open Admin Panel</a>
        </div>`;
    } else if (role === 'moderator' || role === 'editor') {
      accessSection.style.display = 'block';
      accessSection.innerHTML = `
        <div style="background:#fffbf0;border:1.5px solid #f39c12;border-radius:10px;padding:16px 20px">
          <p style="margin:0 0 14px;font-size:.92rem;font-weight:700;color:#d68910">⚙️ Management Panel</p>
          <a href="/admin" class="btn btn-warning" style="text-decoration:none">⚙️ Open Admin Panel</a>
        </div>`;
    } else if (role === 'manager') {
      accessSection.style.display = 'block';
      accessSection.innerHTML = `
        <div style="background:#f0f9ff;border:1.5px solid #3498db;border-radius:10px;padding:16px 20px">
          <p style="margin:0 0 12px;font-size:.92rem;font-weight:700;color:#2980b9">👁️ View-Only Panel</p>
          <p style="margin:0 0 14px;font-size:.84rem;color:#666">You can view data but not make changes.</p>
          <a href="/admin" class="btn btn-info" style="text-decoration:none">👁️ Open View Panel</a>
        </div>`;
    }

  } catch {
    window.location.replace('/login');
  }
})();

/* ── Edit Username ────────────────────────────────────── */
document.getElementById('btnEditUsername')?.addEventListener('click', () => {
  const currentUsername = document.getElementById('displayUsername').textContent;
  document.getElementById('editUsernameInput').value = currentUsername;
  document.getElementById('editUsernameError').textContent = '';
  document.getElementById('editUsernameModal').classList.add('active');
  document.getElementById('editUsernameInput').focus();
});

/* ── Edit Phone ────────────────────────────────────── */
document.getElementById('btnEditPhone')?.addEventListener('click', () => {
  const currentPhone = document.getElementById('displayPhone').textContent;
  document.getElementById('editPhoneInput').value = currentPhone === 'Not provided' ? '' : currentPhone;
  document.getElementById('editPhoneError').textContent = '';
  document.getElementById('editPhoneModal').classList.add('active');
  document.getElementById('editPhoneInput').focus();
});

/* ── Modal Functions ────────────────────────────────────── */
function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

async function saveUsername() {
  const newUsername = document.getElementById('editUsernameInput').value.trim();
  const errorEl = document.getElementById('editUsernameError');
  errorEl.textContent = '';

  if (!newUsername) {
    errorEl.textContent = 'Username is required';
    return;
  }

  if (newUsername.length < 3 || newUsername.length > 30) {
    errorEl.textContent = 'Username must be 3-30 characters long';
    return;
  }

  if (!/^[a-zA-Z0-9_]+$/.test(newUsername)) {
    errorEl.textContent = 'Username can only contain letters, numbers, and underscores';
    return;
  }

  try {
    const res = await fetch('/api/auth/username', {
      method: 'PATCH',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: newUsername })
    });

    const data = await res.json();
    if (data.success) {
      document.getElementById('displayUsername').textContent = newUsername;
      document.getElementById('avatarCircle').textContent = newUsername.charAt(0).toUpperCase();
      document.getElementById('welcomeHeading').textContent = `Welcome back, ${newUsername}!`;
      closeModal('editUsernameModal');
      showAlert('Username updated successfully!', 'success');
    } else {
      errorEl.textContent = data.message || 'Failed to update username';
    }
  } catch (err) {
    errorEl.textContent = 'An error occurred. Please try again.';
    console.error(err);
  }
}

async function savePhone() {
  const newPhone = document.getElementById('editPhoneInput').value.trim();
  const errorEl = document.getElementById('editPhoneError');
  errorEl.textContent = '';

  if (newPhone && newPhone.length < 10) {
    errorEl.textContent = 'Phone number must be at least 10 digits';
    return;
  }

  try {
    const res = await fetch('/api/auth/phone', {
      method: 'PATCH',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: newPhone || null })
    });

    const data = await res.json();
    if (data.success) {
      const displayPhone = newPhone || 'Not provided';
      document.getElementById('displayPhone').textContent = displayPhone;
      closeModal('editPhoneModal');
      showAlert('Phone number updated successfully!', 'success');
    } else {
      errorEl.textContent = data.message || 'Failed to update phone number';
    }
  } catch (err) {
    errorEl.textContent = 'An error occurred. Please try again.';
    console.error(err);
  }
}

/* ── Close modal on overlay click ────────────────────────────────────── */
document.getElementById('editUsernameModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'editUsernameModal') closeModal('editUsernameModal');
});

document.getElementById('editPhoneModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'editPhoneModal') closeModal('editPhoneModal');
});

/* ── Logout ────────────────────────────────────────────── */
document.getElementById('logoutBtn')?.addEventListener('click', logout);
document.getElementById('btnLogoutAccount')?.addEventListener('click', logout);

async function logout() {
  try {
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  } finally {
    window.location.replace('/login');
  }
}
</script>

<script src="/js/session-manager.js"></script>
</body>
</html>
